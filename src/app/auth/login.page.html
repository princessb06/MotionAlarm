<ion-content>
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-heading">
      <h1 id="login-heading">{{ mode === 'register' ? 'Create your account' : 'Login' }}</h1>
      <div class="account-tabs" role="group" aria-label="Account access">
        <button
          type="button"
          [class.selected]="mode === 'login'"
          [attr.aria-pressed]="mode === 'login'"
          [disabled]="isSubmitting"
          (click)="switchForm('login')"
        >
          Log in
        </button>
        <button
          type="button"
          [class.selected]="mode === 'register'"
          [attr.aria-pressed]="mode === 'register'"
          [disabled]="isSubmitting"
          (click)="switchForm('register')"
        >
          Register
        </button>
      </div>
      <form (ngSubmit)="submitForm()">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email address"
          autocomplete="email"
          required
          maxlength="254"
          [(ngModel)]="email"
          [disabled]="isSubmitting"
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          [type]="passwordType"
          [placeholder]="mode === 'register' ? 'Create a password' : 'Enter your password'"
          [autocomplete]="mode === 'register' ? 'new-password' : 'current-password'"
          required
          [attr.minlength]="mode === 'register' ? minPasswordLength : null"
          [attr.maxlength]="mode === 'register' ? maxPasswordLength : null"
          [(ngModel)]="password"
          [disabled]="isSubmitting"
        />
        @if (mode === 'register') {
        <label for="confirmation">Confirm password</label>
        <input
          id="confirmation"
          name="confirmation"
          [type]="passwordType"
          placeholder="Re-enter your password"
          autocomplete="new-password"
          required
          [attr.minlength]="minPasswordLength"
          [attr.maxlength]="maxPasswordLength"
          [(ngModel)]="confirmPassword"
          [disabled]="isSubmitting"
        />
        }
        <label class="show-password-option" for="show-password">
          <input
            id="show-password"
            type="checkbox"
            [checked]="passwordType === 'text'"
            [disabled]="isSubmitting"
            (change)="togglePassword()"
          />
          {{ mode === 'register' ? 'Show passwords' : 'Show password' }}
        </label>
        <ion-button type="submit" expand="block" [disabled]="isSubmitting">
          @if (isSubmitting) { Please wait… } @else if (mode === 'register') { Create account } @else { Log in }
        </ion-button>
      </form>
      @if (error || auth.error()) {
      <p class="error-message" role="alert">{{ error || auth.error() }}</p>
      }
    </section>
  </main>
</ion-content>
